# Minimal SearXNG settings override for the DeepSeek Harness search provider.
use_default_settings: true
server:
  # REQUIRED in production - generate once with: openssl rand -hex 32
  # The app exits at startup if the stock default is used.
  secret_key: "<REDACTED — lives only in the server file>"
  # Trimmed compose has no valkey service, so the limiter stays off.
  limiter: false
  # Makes absolute URLs/links in the UI and API correct.
  base_url: http://192.168.144.120:8888
search:
  # JSON format is OFF by default in the image; the provider needs it.
  formats:
    - html
    - json
use_default_settings: true
engines:
  - name: bing
    disabled: false
  - name: qwant
    disabled: false
  - name: yahoo
    disabled: false
  - name: mwmbl
    disabled: false
